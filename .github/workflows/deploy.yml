name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The browser tests (128, of them 78 axe checks) took 7 minutes on a shared four-core machine. On the runner the
    # whole job took 24 min 10 s (run 890) against a limit of 25, so the limit leaves room for a slow runner.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site is built first: many tests read the built pages, and without them they are skipped.
      - run: npm run build
      # bash with pipefail: a failing test fails the step even though its output goes through tee; then no test may
      # have been skipped and none may have failed.
      - name: npm test (no test may fail or be skipped)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          grep -q '^# fail 0$' test.log
          grep -q '^# skipped 0$' test.log
      - run: node scripts/check-coaching-build.mjs
      # The reader journeys in a real browser (tests/browser): the built site at three widths, in both themes, with
      # the accessibility check. Only Chromium is installed, with the system libraries it needs: the Chrome for Testing
      # that the pinned @playwright/test brings (1.64.1: Chrome 156), so the journeys run on a current browser; the log
      # names its version. Keep @playwright/test current, or the tests drive a browser readers no longer use.
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (no journey may fail or be skipped)
        id: browser
        shell: bash
        run: |
          set -o pipefail
          node -e "const { chromium } = require('@playwright/test'); chromium.launch().then(async (b) => { console.log('Chromium', b.version()); await b.close(); })"
          npm run test:browser 2>&1 | tee browser-test.log
          grep -qE '^ +[0-9]+ passed' browser-test.log
          if grep -qE '^ +[0-9]+ (skipped|flaky|did not run)' browser-test.log; then exit 1; fi
      # Only when the browser tests failed: the trace of each failed test (playwright.config.mjs keeps a trace only on
      # failure), for 7 days. The repository is public: treat every trace as accessible to others. The tests use
      # fictional data only. The standard fixture (fixtures.mjs) blocks every request outside the local test server, but
      # three tests open their own browser context, which does not inherit that block (print.spec.mjs,
      # work-backup-photos.spec.mjs, tool-filter.spec.mjs). Those contexts load local pages only; with tracing on for
      # every test (PR 404) they made no request outside 127.0.0.1. The job stays failed whatever this step does; no
      # trace found gives a warning, not a pass.
      - name: Keep the traces of the failed browser tests
        if: failure() && steps.browser.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser/**/trace.zip
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
