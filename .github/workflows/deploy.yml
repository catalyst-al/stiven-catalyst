name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site is built first: many tests read the built pages, and without them they are skipped.
      - run: npm run build
      # bash with pipefail: a failing test fails the step even though its output goes through tee; then no test may
      # have been skipped and none may have failed.
      - name: npm test (no test may fail or be skipped)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          grep -q '^# fail 0$' test.log
          grep -q '^# skipped 0$' test.log
      - run: node scripts/check-coaching-build.mjs
      # The reader journeys in a real browser (tests/browser): the built site at three widths, in both themes, with
      # the accessibility check. Only Chromium is installed, with the system libraries it needs.
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (no journey may fail)
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-test.log
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
